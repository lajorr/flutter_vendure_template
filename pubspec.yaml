name: vendure_flutter_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0


scripts:
  build: dart run build_runner build --delete-conflicting-outputs          

dependencies:
  dartz: ^0.10.1
  equatable: ^2.0.8
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  freezed_annotation: ^3.1.0
  go_router: ^17.1.0
  graphql_flutter: ^5.2.1
  json_annotation: ^4.11.0
  logger: ^2.6.2
  riverpod_annotation: ^4.0.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_secure_storage: ^9.2.2
  country_code_picker: ^3.4.1
  flutter_svg: ^2.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.12.2
  freezed: ^3.2.5
  json_serializable: ^6.13.0
  riverpod_generator: ^4.0.3
  flutter_gen_runner: ^5.3.2


flutter:
  uses-material-design: true
  assets:
    - assets/icons/


flutter_gen:
  output: lib/gen/ # Output directory for generated files
  line_length: 80 # Line length for generated files
  integrations:
    flutter_svg: true
  # exclude:
  #     - .env.example

  # Assets configuration
  assets:
    outputs:
      class_name: Assets
      package_parameter_enabled: false
